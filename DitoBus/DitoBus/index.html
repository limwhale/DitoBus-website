<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ditobus_main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>

    <title>DitoBus</title>
</head>
<body>
    <div class="dashboard-header">
        <h1>DitoBus</h1>
        <div class="nav-links">
            <a href="index.html" id="M">Maps</a> 
            <a href="#" id="BS">Bus Schedule</a> 
            <a href="ditobus_settings.html" id="S">Settings</a>
        </div>
        <div class="profile-container">
            <button id="profileBtn" class="auth-toggle-btn">
                <span id="profileBtnText">Log In / Sign Up</span>
                <img id="pfp" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" style="display: none;">
            </button>
        </div>
    </div>

    <!-- pop up modal-->
    <div class="auth-popup" id="authPopup">
        <!-- not logged in view -->
        <div id="loggedOutView">
            <h3 id="formTitle">Login</h3>
            <div id="authError" style="color: #ff4d4d; font-size: 13px; margin-bottom: 8px; display: none;"></div>
            <form id="authForm" onsubmit="event.preventDefault();">
                <input type="email" placeholder="Email" id="emailInput" required>
                <input type="password" placeholder="Password" id="passwordInput" required>
                <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
                <select id="genderInput" style="display: none;">
                    <option value="" disabled selected>Please select gender:</option>
                    <option value="prefer-not">Prefer not to say</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
                
                <button type="submit" id="submitBtn">Log In</button>
            </form>
    
            <button type="button" id="googleBtn" class="guest-btn google-btn"><svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</button>
            <button type="button" id="guestBtn" class="guest-btn">Continue as Guest</button>
    
            <div class="toggle-text">
                <span id="toggleMsg">Don't have an account?</span> 
                <a href="#" id="toggleAuth">Sign Up</a>
            </div>
        </div>

        <!-- logged in view-->
        <div id="loggedInView" style="display: none;">
            <h3 id="welcomeTitle">Welcome</h3>
            <p id="userEmailDisplay"></p>
            <button type="button" id="editShiftBtn">Edit Shift</button>
            <button type="button" id="logoutBtn">Log Out</button>
        </div>
    </div>
     
    <div id="map"></div>

    <div class="modal-overlay" id="shiftPromptModal" style="display: none;">
        <div class="conductor-modal" style="position: relative; text-align: center;">
            <button id="closeShiftPromptModal" class="close-modal-btn">&times;</button>
            <h2>Ready to start shift?</h2>
            <p style="margin: 10px 0 20px 0; color: #aaa; font-size: 14px;">Set up your bus route details for today's tracking.</p>
            <button type="button" id="startShiftBtn" class="primary-btn full-width-btn" style="background-color: #00d2ff; color: #1a1a1a; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer;">Start Shift</button>
        </div>
    </div>

    <!-- employee Conductor Info Modal -->
    <div class="modal-overlay" id="conductorModal" style="display: none;">
        <div class="conductor-modal" style="position: relative;">
            <button id="closeConductorModal" class="close-modal-btn">&times;</button>
            <h3>Conductor Shift Setup</h3>
            <form id="conductorForm" onsubmit="event.preventDefault();">
                <label for="busPlate">Bus Plate Number</label>
                <input type="text" id="busPlate" placeholder="e.g. ABC 1234" required>

                <label for="busLocation">Starting Location (Terminals)</label>
                <select id="busLocation" required>
                    <option value="" disabled selected>Select starting terminal</option>
                    <option value="Cabanatuan Central Transport Terminal (Cabanatuan City)">Cabanatuan Central Transport Terminal (Cabanatuan City)</option>
                    <option value="San Jose City Central Terminal (San Jose City)">San Jose City Central Terminal (San Jose City)</option>
                    <option value="Gapan Central Terminal (Gapan City)">Gapan Central Terminal (Gapan City)</option>
                    <option value="Science City of Muñoz Integrated Terminal (Muñoz)">Science City of Muñoz Integrated Terminal (Muñoz)</option>
                    <option value="Guimba Public Transport Terminal (Guimba)">Guimba Public Transport Terminal (Guimba)</option>
                    <option value="Talavera Public Market & Transport Hub (Talavera)">Talavera Public Market & Transport Hub (Talavera)</option>
                </select>

                <label for="busDestination">Destination Hub</label>
                <select id="busDestination" required>
                    <option value="" disabled selected>Select destination hub</option>
                    <option value="Cabanatuan City">Cabanatuan City</option>
                    <option value="San Jose City">San Jose City</option>
                    <option value="Gapan City">Gapan City</option>
                    <option value="Science City of Muñoz">Science City of Muñoz</option>
                    <option value="Talavera">Talavera</option>
                    <option value="Guimba">Guimba</option>
                    <option value="Rizal and Pantabangan">Rizal and Pantabangan</option>
                    <option value="Palayan City">Palayan City</option>
                </select>

                <label for="departureTime">Time of Departure</label>
                <input type="time" id="departureTime" required>

                <button type="submit" id="submitShiftBtn" style="margin-top: 15px;">Save & Launch Shift</button>
            </form>
        </div>
    </div>

    <!-- schedule modal -->
    <div id="busScheduleModal" class="schedule-modal-overlay" style="display: none;">
        <div class="schedule-modal-content">
            <button id="closeScheduleModal" class="close-modal-btn">&times;</button>
            <h3>DitoBus Schedule</h3>
            <input type="text" id="scheduleSearch" placeholder="Search plate, location, or destination...">
            <div id="scheduleContainer" style="margin-top: 15px;">
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="ditobus_main.js"></script>
</body>
</html>
